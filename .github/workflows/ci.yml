name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Compile, import, and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        # ubuntu-latest (26.04) has no 3.8/3.9 builds, so those run on 24.04
        exclude:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: python -m compileall discordrpc
      - name: Import package
        run: python -c "import discordrpc"
      - name: Run tests
        run: python tests/run_tests.py
